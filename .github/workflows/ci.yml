name: CI Test

on:
  push:
    branches:  [submission, lain]
  pull_request:
    branches:  [submission, lain]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Run Jest test
        run: npm test -- --watchAll=false